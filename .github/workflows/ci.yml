# make check on macOS: every linter, the Rust tests and the TypeScript
# type-check, as the pre-commit hook runs them. Only for pushes that change the app, not the docs,
# the product page or sift's records alone; it can also be started from the Actions tab.
name: CI
on:
  push:
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "_sift/**"
      - "**/*.md"
      - "LICENSE"
      - ".github/workflows/pages.yml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "_sift/**"
      - "**/*.md"
      - "LICENSE"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: pipx install ruff
      - run: brew install shellcheck
      # tauri::generate_context! wants the frontend's output folder to exist.
      - run: mkdir -p dist
      - run: make check
