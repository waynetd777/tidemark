<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tidemark</title>
    <!--
      Inline splash: no stylesheet, no JS bundle, no cache read in the way, so it paints as soon
      as the webview does and covers the wait for the real UI. Rust shows the window itself
      (lib.rs) already carrying the theme colour, so there is no white flash.
      Keep the two background colours in step with --bg in src/styles.css and lib.rs.
    -->
    <script>
      if (new URLSearchParams(location.search).get("view") === "tray")
        document.documentElement.classList.add("tray");
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <style>
      :root {
        color-scheme: light dark;
        --splash-bg: #ededf0;
        --splash-fg: #1d1d1f;
        --splash-dim: #6e6e73;
        --splash-line: rgba(0, 0, 0, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --splash-bg: #161616;
          --splash-fg: #f2f2f4;
          --splash-dim: #9a9aa2;
          --splash-line: rgba(255, 255, 255, 0.1);
        }
      }
      :root[data-theme="dark"] {
        --splash-bg: #161616;
        --splash-fg: #f2f2f4;
        --splash-dim: #9a9aa2;
        --splash-line: rgba(255, 255, 255, 0.1);
      }
      html,
      body {
        background: var(--splash-bg);
        margin: 0;
      }
      /* The menu-bar window: transparent around its rounded panel, and no splash. */
      html.tray,
      html.tray body {
        background: transparent;
      }
      html.tray #splash {
        display: none;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: var(--splash-bg);
        font:
          13px/1.4 -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          "Segoe UI",
          sans-serif;
        color: var(--splash-fg);
        transition: opacity 0.18s ease-out;
      }
      #splash.gone {
        opacity: 0;
        pointer-events: none;
      }
      #splash .mark {
        width: 68px;
        height: 68px;
        animation: rise 0.35s ease-out both;
      }
      #splash .name {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      #splash .what {
        font-size: 12px;
        color: var(--splash-dim);
        margin-top: -8px;
      }
      #splash .bar {
        width: 152px;
        height: 3px;
        border-radius: 99px;
        background: var(--splash-line);
        overflow: hidden;
      }
      #splash .bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 99px;
        background: #0b6e8a;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(360%);
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: scale(0.94);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .mark,
        #splash .bar i {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <div id="splash">
      <!-- The app icon (public/icon.png, as src/Mark.tsx draws it). -->
      <img class="mark" src="/icon.png" alt="" />
      <div class="name">Tidemark</div>
      <div class="what">The high-water marks of your Mac</div>
      <div class="bar"><i></i></div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
